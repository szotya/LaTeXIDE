[workspace]
members = ["crates/latexide-core", "crates/latexide-protocol", "crates/latexide-ffi", "crates/latexide-build", "crates/latexide-mcp", "crates/latexide-contracts"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
latexide-contracts = { path = "crates/latexide-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.8.0", features = ["server", "transport-io"] }
interprocess = { version = "=2.4.7" }

[profile.release]
lto = "thin"
strip = "debuginfo"

# Native editor queries and their contract validation run synchronously.
# Debug symbols/assertions/overflow checks remain enabled; other crates keep their normal profile.
[profile.dev.package.latexide-core]
opt-level = 2

# UTF-16 batch validation is on the same normal synchronous Runtime path.
[profile.dev.package.latexide-contracts]
opt-level = 2
